# Vulnalyze Custom Semgrep Rules
# These rules codify the 30+ regex patterns from the built-in scanner as proper Semgrep YAML rules.
# Usage: semgrep --config scanner-rules/vulnalyze.yml <target>

rules:
  # ── A02: Cryptographic Failures ──────────────────────────────────────────
  - id: vulnalyze.weak-hash-md5
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: md5(...)
    message: >
      MD5 is cryptographically broken. Use SHA-256 or bcrypt for password hashing.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH

  - id: vulnalyze.weak-hash-sha1
    patterns:
      - pattern-either:
          - pattern: hashlib.sha1(...)
          - pattern: sha1(...)
    message: >
      SHA-1 is deprecated for cryptographic use. Replace with SHA-256 or stronger.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: HIGH

  # ── A03: Injection ───────────────────────────────────────────────────────
  - id: vulnalyze.eval-injection
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: >
      Dynamic execution of code via eval()/exec() enables remote code execution.
      Use safe alternatives.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      confidence: HIGH

  - id: vulnalyze.os-command-injection
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: subprocess.call(..., shell=True, ...)
    message: >
      Shell command built with user input. Use subprocess with a list and shell=False.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      confidence: HIGH

  - id: vulnalyze.unsafe-yaml-load
    pattern: yaml.load(...) 
    message: >
      yaml.load() without SafeLoader can execute arbitrary Python code.
      Use yaml.safe_load() instead.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021-Software and Data Integrity Failures"
      confidence: HIGH

  - id: vulnalyze.pickle-deserialization
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
    message: >
      Deserializing untrusted data with pickle allows arbitrary code execution.
      Use JSON or a schema-validated format.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021-Software and Data Integrity Failures"
      confidence: HIGH

  # ── A05: Security Misconfiguration ───────────────────────────────────────
  - id: vulnalyze.ssl-verify-disabled
    patterns:
      - pattern-either:
          - pattern: "... verify=False ..."
          - pattern: "... ssl_verify=False ..."
    message: >
      Disabling SSL certificate verification allows man-in-the-middle attacks.
      Remove verify=False in production.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-295"
      owasp: "A05:2021-Security Misconfiguration"
      confidence: HIGH

  - id: vulnalyze.debug-mode-enabled
    pattern: "DEBUG = True"
    message: >
      Debug mode is enabled. This exposes stack traces and internal details in production.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-94"
      owasp: "A04:2021-Insecure Design"
      confidence: HIGH

  # ── A07: Authentication Failures ─────────────────────────────────────────
  - id: vulnalyze.insecure-random
    patterns:
      - pattern-either:
          - pattern: random.random()
          - pattern: random.randint(...)
    message: >
      random module is not cryptographically secure. Use secrets module for
      security-sensitive values (tokens, keys, session IDs).
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-338"
      owasp: "A07:2021-Identification and Authentication Failures"
      confidence: HIGH

  # ── Hardcoded Secrets ────────────────────────────────────────────────────
  - id: vulnalyze.hardcoded-password
    pattern-regex: "password\\s*=\\s*['\"][^'\"]{4,}['\"]"
    message: >
      Password or secret appears hardcoded. Use environment variables or a secrets manager.
    severity: ERROR
    languages: [generic]
    metadata:
      cwe: "CWE-798"
      owasp: "A02:2021-Cryptographic Failures"
      confidence: MEDIUM
