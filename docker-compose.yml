version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnalyze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnalyze_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vulnalyze}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnalyze}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zap:
    image: zaproxy/zap-stable
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
      -config api.disablekey=true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-vulnalyze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnalyze_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vulnalyze}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production_12345}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ZAP_HOST: zap
      ZAP_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
