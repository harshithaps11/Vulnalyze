version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnalyze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnalyze_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vulnalyze}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnalyze}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-vulnalyze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnalyze_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vulnalyze}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production_12345}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
